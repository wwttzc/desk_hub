# RGB Matrix configuration for the Desk Hub numpad.
#
# Read by `rmk-macro` during the build, from the directory holding
# keyboard.toml. The keys mirror QMK's `rgb_matrix` / `ws2812` sections and its
# `config.h` macros, so a QMK board's settings carry over directly.

[rgb_matrix]
enabled = true
# 19 WS2812 at full white would draw about 1.1 A. This ceiling puts the peak
# near 450 mA, which leaves room for the MCU on a 500 mA USB port. It is also
# the top of Vial's brightness slider.
max_brightness = 100
# Half of the 132 x 220 coordinate span below. The distance-based effects
# measure from here.
center_point = [66, 110]

[rgb_matrix.default]
on = true
# A left-to-right gradient: the quickest way to see whether the LED order and
# positions are right, because a wrong coordinate distorts the ramp visibly.
animation = "cycle_left_right"
hue = 0
sat = 255
val = 100
speed = 127

# --- Enabled effects ---
#
# This table is a **whitelist**: once it is non-empty, only the names listed here
# appear in Vial, and an entry set to `false` is *skipped* rather than treated as
# "disable this one". So narrowing the list means naming everything that should
# stay, not naming what should go.
#
# The three effects deliberately left out, all of which are sparse by design and
# need more work before they are worth having on the board:
#
#   raindrops     (id 24) — QMK seeds the whole chain on the first frame, but the
#                           seeding only covers the first batch, so most of the
#                           chain fills in one LED at a time
#   digital_rain  (id 30) — the white droplet head picks up a colour cast
#   pixel_rain    (id 43) — only a couple of LEDs ever toggle; the cycle re-arms
#                           its timer on the frame's last batch while the LED is
#                           painted by whichever batch owns its index
#
# A misspelled name here is only a warning, not an error, and shows up as
# "the effect is missing from Vial". The list is checked against the parser.
[rgb_matrix.animations]
solid_color = true
alpha_mods = true
gradient_up_down = true
gradient_left_right = true
breathing = true
band_sat = true
band_val = true
band_pinwheel_sat = true
band_pinwheel_val = true
band_spiral_sat = true
band_spiral_val = true
cycle_all = true
cycle_left_right = true
cycle_up_down = true
rainbow_moving_chevron = true
cycle_out_in = true
cycle_out_in_dual = true
cycle_pinwheel = true
cycle_spiral = true
dual_beacon = true
rainbow_beacon = true
rainbow_pinwheels = true
jellybean_raindrops = true
hue_breathing = true
hue_pendulum = true
hue_wave = true
typing_heatmap = true
solid_reactive_simple = true
solid_reactive = true
solid_reactive_wide = true
solid_reactive_multiwide = true
solid_reactive_cross = true
solid_reactive_multicross = true
solid_reactive_nexus = true
solid_reactive_multinexus = true
splash = true
multisplash = true
solid_splash = true
solid_multisplash = true
pixel_fractal = true

# --- LED table: one entry per LED, in chain order ---
#
# The order of the entries below **is the soldering order of the chain**: the
# first entry is the LED nearest the MCU. Getting this wrong is what makes an
# effect light the wrong key, so the order here came from the board, not from
# the key grid.
#
# Coordinates come from the board's grid formula, with the matrix position as
# the index:
#
#   x = 132 / (4 - 1) * col
#   y = 220 / (6 - 1) * row
#
# Both divide to a 44-unit step, so the key grid is square: the columns take
# 0, 44, 88, 132 and the rows 0, 44, 88, 132, 176, 220.
#
# Three LEDs do not sit on that grid, because their key is wider than 1u and the
# LED is mounted where the key's body actually is:
#
#   (5,0) `0`       x 0 -> 22     centred in the 2u-wide key
#   (3,3) `+`       x 132 -> 121, y 132 -> 99
#   (5,3) `Enter`   x 132 -> 121, y 220 -> 187
#
# The tall keys sit on their lower row, which is where their switch is: `+`
# spans the `7 8 9` and `4 5 6` rows and is wired at row 3, `Enter` spans the
# `1 2 3` and `0` rows and is wired at row 5. That leaves (2,3) and (4,3)
# unpopulated, and puts `.` on column 2 rather than next to `0` — `0` is 2u
# wide, so (5,1) is empty too.
#
# `matrix` is the electrical (row, col), matching keyboard.toml. It is what
# connects a keypress to its LED for the reactive effects.
#
# The chain walks the electrical rows from top to bottom, and each row from its
# highest column down to column 0 — right to left on the board. That is the
# order the entries below record, and it is the order the LEDs are soldered in,
# not the order the keys are read.
#
# If a column does not light where the gradient says it should, the LED chain
# order here is what to reorder.

# -- top row, right to left --
[[rgb_matrix.layout]]
x = 44
y = 0
matrix = [0, 1]

[[rgb_matrix.layout]]
x = 0
y = 0
matrix = [0, 0]

# -- NumLock row, right to left --
[[rgb_matrix.layout]]
x = 132
y = 44
matrix = [1, 3]

[[rgb_matrix.layout]]
x = 88
y = 44
matrix = [1, 2]

[[rgb_matrix.layout]]
x = 44
y = 44
matrix = [1, 1]

[[rgb_matrix.layout]]
x = 0
y = 44
matrix = [1, 0]

# -- 7 8 9, right to left --
[[rgb_matrix.layout]]
x = 88
y = 88
matrix = [2, 2]

[[rgb_matrix.layout]]
x = 44
y = 88
matrix = [2, 1]

[[rgb_matrix.layout]]
x = 0
y = 88
matrix = [2, 0]

# -- 4 5 6 +, right to left --
[[rgb_matrix.layout]]
x = 121
y = 99
matrix = [3, 3]

[[rgb_matrix.layout]]
x = 88
y = 132
matrix = [3, 2]

[[rgb_matrix.layout]]
x = 44
y = 132
matrix = [3, 1]

[[rgb_matrix.layout]]
x = 0
y = 132
matrix = [3, 0]

# -- 1 2 3, right to left --
[[rgb_matrix.layout]]
x = 88
y = 176
matrix = [4, 2]

[[rgb_matrix.layout]]
x = 44
y = 176
matrix = [4, 1]

[[rgb_matrix.layout]]
x = 0
y = 176
matrix = [4, 0]

# -- 0 . Enter, right to left --
[[rgb_matrix.layout]]
x = 121
y = 187
matrix = [5, 3]

[[rgb_matrix.layout]]
x = 88
y = 220
matrix = [5, 2]

[[rgb_matrix.layout]]
x = 22
y = 220
matrix = [5, 0]

[ws2812]
# Measured from the board.
pin = "GPIO4"
driver = "rmt"
rgbw = false
# WS2812 wants green first, which is also the driver's default.
color_order = "grb"
